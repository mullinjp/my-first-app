<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♪ 幼稚園のお時間ちゃん ♪</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap');
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }
        .bounce-animation {
            animation: bounce 0.6s infinite alternate;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-300 via-purple-200 to-indigo-200 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl p-8 max-w-md w-full text-center border-4 border-pink-300 relative overflow-hidden">
        
        <!-- Decoration background circles -->
        <div class="absolute -top-10 -left-10 w-32 h-32 bg-yellow-200 rounded-full opacity-50 pointer-events-none"></div>
        <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-pink-200 rounded-full opacity-50 pointer-events-none"></div>

        <!-- Title Header -->
        <div class="relative z-10 mb-6">
            <span class="inline-block bg-pink-100 text-pink-600 font-bold px-4 py-1 rounded-full text-sm mb-2 shadow-sm">
                <i class="fa-solid fa-clock mr-1"></i> たのしいおしゃべりとけい
            </span>
            <h1 class="text-3xl font-extrabold text-pink-500 tracking-wide drop-shadow-sm">
                ♪ お時間ちゃん ♪
            </h1>
        </div>

        <!-- Time Display Box -->
        <div class="bg-gradient-to-r from-pink-50 to-purple-50 rounded-2xl p-4 my-4 border-2 border-pink-200 shadow-inner">
            <p class="text-sm text-gray-500 font-bold mb-1">いまのじかん</p>
            <div id="currentTime" class="text-3xl font-black text-gray-700 tracking-wider">
                00:00:00
            </div>
            <div id="dateDisplay" class="text-xs text-pink-400 font-bold mt-1">
                ----年--月--日(--)
            </div>
        </div>

        <!-- Big Interactive Button -->
        <div class="my-6 relative flex justify-center items-center">
            <button id="speakBtn" class="w-48 h-48 rounded-full bg-gradient-to-tr from-pink-400 to-pink-500 hover:from-pink-500 hover:to-pink-600 active:scale-95 text-white font-extrabold text-2xl shadow-xl hover:shadow-pink-300/50 transition-all duration-200 flex flex-col items-center justify-center gap-2 border-8 border-white group relative">
                <i id="btnIcon" class="fa-solid fa-face-smile text-5xl group-hover:scale-110 transition-transform"></i>
                <span id="btnText">ぽんっ！</span>
            </button>
        </div>

        <!-- Dynamic Status Message / Subtitle -->
        <div id="subtitleBox" class="min-h-[48px] bg-pink-50 rounded-xl p-3 border border-pink-100 flex items-center justify-center">
            <p id="statusMessage" class="text-sm font-bold text-pink-600">
                ボタンを押すと、元気にお知らせするよ！
            </p>
        </div>

        <!-- Footer Notice -->
        <div class="mt-6 text-xs text-pink-400 font-bold flex items-center justify-center gap-1">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Gemini AI Voice (Aoede) で喋ります♪
        </div>
    </div>

    <script>
        // Set your Gemini API key here (Environment provides it at runtime if blank)
        const apiKey = "";

        const btn = document.getElementById('speakBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const timeDisplay = document.getElementById('currentTime');
        const dateDisplay = document.getElementById('dateDisplay');
        const statusMessage = document.getElementById('statusMessage');

        let isSpeaking = false;

        // Digital Clock Update Function
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            timeDisplay.textContent = `${hours}:${minutes}:${seconds}`;

            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            const dayName = days[now.getDay()];
            dateDisplay.textContent = `${year}年${month}月${date}日 (${dayName})`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Convert PCM Audio Data to standard WAV ArrayBuffer for Web Audio Playback
        function pcmToWav(pcmData, sampleRate = 24000, numChannels = 1, bitsPerSample = 16) {
            const headerLength = 44;
            const dataLength = pcmData.byteLength;
            const buffer = new ArrayBuffer(headerLength + dataLength);
            const view = new DataView(buffer);

            // RIFF identifier
            writeString(view, 0, 'RIFF');
            // file length minus RIFF header
            view.setUint32(4, 36 + dataLength, true);
            // RIFF type
            writeString(view, 8, 'WAVE');
            // format chunk identifier
            writeString(view, 12, 'fmt ');
            // format chunk length
            view.setUint32(16, 16, true);
            // sample format (1 = PCM)
            view.setUint16(20, 1, true);
            // channel count
            view.setUint16(22, numChannels, true);
            // sample rate
            view.setUint32(24, sampleRate, true);
            // byte rate (sample rate * block align)
            view.setUint32(28, sampleRate * numChannels * (bitsPerSample / 8), true);
            // block align (number of channels * bytes per sample)
            view.setUint16(32, numChannels * (bitsPerSample / 8), true);
            // bits per sample
            view.setUint16(34, bitsPerSample, true);
            // data chunk identifier
            writeString(view, 36, 'data');
            // data chunk length
            view.setUint32(40, dataLength, true);

            // Write PCM samples
            const pcmBytes = new Uint8Array(pcmData);
            const wavBytes = new Uint8Array(buffer, headerLength);
            wavBytes.set(pcmBytes);

            return buffer;
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        // Fetch TTS from Gemini API with Exponential Backoff
        async function fetchGeminiTTS(promptText, retries = 5, delay = 1000) {
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [
                    {
                        parts: [
                            { text: promptText }
                        ]
                    }
                ],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                        voiceConfig: {
                            prebuiltVoiceConfig: {
                                voiceName: "Aoede" // Bright, cheerful female voice suitable for cute prompts
                            }
                        }
                    }
                }
            };

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP Error ${response.status}`);
                    }

                    const result = await response.json();
                    const inlineData = result?.candidates?.[0]?.content?.parts?.[0]?.inlineData;

                    if (inlineData && inlineData.data) {
                        return {
                            base64Data: inlineData.data,
                            mimeType: inlineData.mimeType || "audio/L16;rate=24000"
                        };
                    } else {
                        throw new Error("Audio data missing in response");
                    }
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2; // Exponential backoff
                }
            }
        }

        // Play WAV Audio
        async function playAudio(base64Data, mimeType) {
            return new Promise((resolve, reject) => {
                try {
                    // Extract sample rate from mimeType if available (e.g., audio/L16;rate=24000)
                    let sampleRate = 24000;
                    if (mimeType && mimeType.includes('rate=')) {
                        const match = mimeType.match(/rate=(\d+)/);
                        if (match && match[1]) {
                            sampleRate = parseInt(match[1], 10);
                        }
                    }

                    // Decode base64 to binary ArrayBuffer
                    const binaryString = atob(base64Data);
                    const len = binaryString.length;
                    const bytes = new Uint8Array(len);
                    for (let i = 0; i < len; i++) {
                        bytes[i] = binaryString.charCodeAt(i);
                    }

                    // Convert raw PCM to WAV
                    const wavBuffer = pcmToWav(bytes.buffer, sampleRate);
                    const blob = new Blob([wavBuffer], { type: 'audio/wav' });
                    const audioUrl = URL.createObjectURL(blob);

                    const audio = new Audio(audioUrl);
                    audio.onended = () => {
                        URL.revokeObjectURL(audioUrl);
                        resolve();
                    };
                    audio.onerror = (e) => {
                        URL.revokeObjectURL(audioUrl);
                        reject(e);
                    };
                    audio.play();
                } catch (err) {
                    reject(err);
                }
            });
        }

        // Action when button is clicked
        async function speakTime() {
            if (isSpeaking) return;

            isSpeaking = true;
            btn.disabled = true;
            btnText.textContent = "かんがえちゅう...";
            btnIcon.className = "fa-solid fa-spinner fa-spin text-5xl";
            statusMessage.textContent = "声を準備しているよ♪";

            const now = new Date();
            const hour = now.getHours();
            const minute = now.getMinutes();
            const second = now.getSeconds();

            // Create Japanese spoken text suitable for kindergarten style
            const timeSpeech = `${hour}時${minute}分${second}秒`;
            const spokenScript = `Say energetically and cheerfully like a cute kindergarten girl: えへへ、いまはね！ ${timeSpeech} だよ！今日も元気にがんばろうね！`;
            const displayText = `「えへへ、いまはね！${hour}時${minute}分${second}秒 だよ！今日も元気にがんばろうね！」`;

            try {
                // Get Speech from Gemini TTS API
                const audioResult = await fetchGeminiTTS(spokenScript);

                // UI Update for Speaking State
                btnText.textContent = "おしゃべり中!";
                btnIcon.className = "fa-solid fa-volume-high text-5xl bounce-animation";
                statusMessage.textContent = displayText;

                // Play Audio
                await playAudio(audioResult.base64Data, audioResult.mimeType);

            } catch (error) {
                console.error("Gemini TTS Error:", error);
                // Fallback to browser built-in Web Speech API if API fails
                fallbackWebSpeech(displayText);
            } finally {
                // Reset UI State
                isSpeaking = false;
                btn.disabled = false;
                btnText.textContent = "ぽんっ！";
                btnIcon.className = "fa-solid fa-face-smile text-5xl";
                setTimeout(() => {
                    if (!isSpeaking) {
                        statusMessage.textContent = "ボタンを押すと、元気にお知らせするよ！";
                    }
                }, 3000);
            }
        }

        // Web Speech API Fallback
        function fallbackWebSpeech(textToRead) {
            if ('speechSynthesis' in window) {
                const cleanText = textToRead.replace(/「|」/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                const voices = speechSynthesis.getVoices();
                const jpVoice = voices.find(v => v.lang.includes('ja'));
                if (jpVoice) utterance.voice = jpVoice;
                utterance.pitch = 1.4;
                utterance.rate = 1.1;
                speechSynthesis.cancel();
                speechSynthesis.speak(utterance);
            } else {
                statusMessage.textContent = "声が出せませんでした😢";
            }
        }

        btn.addEventListener('click', speakTime);
    </script>
</body>
</html>
